<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#fff1f5">
  <title>Маленькое объятие для тебя</title>
  <style>
    :root {
      color-scheme: light;
      font-family: "Trebuchet MS", "Segoe UI", sans-serif;
      background: #fff1f5;
      color: #654752;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      overflow: hidden;
      background:
        radial-gradient(ellipse at 15% 15%, #fff 0 2px, transparent 3px),
        radial-gradient(ellipse at 80% 25%, #fff 0 2px, transparent 3px),
        linear-gradient(145deg, #fff8fa, #ffe9f0 55%, #f8eaff);
      background-size: 90px 90px, 120px 120px, auto;
    }

    .card {
      position: relative;
      width: min(90vw, 470px);
      padding: 42px 32px 36px;
      text-align: center;
      border: 1px solid #fff;
      border-radius: 32px;
      background: rgb(255 255 255 / 82%);
      box-shadow: 0 24px 70px rgb(173 105 132 / 18%);
      animation: arrive 900ms cubic-bezier(.2,.8,.2,1) both;
    }

    .tag {
      display: inline-block;
      padding: 8px 14px;
      border-radius: 99px;
      background: #fff0f5;
      color: #bb6d89;
      font-size: .8rem;
      letter-spacing: .08em;
    }

    .bear {
      position: relative;
      width: 150px;
      height: 142px;
      margin: 27px auto 20px;
      border-radius: 48% 48% 45% 45%;
      background: linear-gradient(145deg, #f5c9a6, #e9a77f);
      box-shadow: inset -9px -9px 0 rgb(183 107 79 / 10%);
    }

    .ear {
      position: absolute;
      z-index: -1;
      top: -15px;
      width: 52px;
      height: 52px;
      border: 8px solid #eeb895;
      border-radius: 50%;
      background: #f8d7be;
    }
    .ear.left { left: 2px; }
    .ear.right { right: 2px; }

    .eye {
      position: absolute;
      top: 57px;
      width: 8px;
      height: 11px;
      border-radius: 50%;
      background: #624344;
    }
    .eye.left { left: 43px; }
    .eye.right { right: 43px; }

    .muzzle {
      position: absolute;
      top: 72px;
      left: 50%;
      width: 34px;
      height: 24px;
      transform: translateX(-50%);
      border-radius: 50%;
      background: #ffe8d8;
    }
    .muzzle::before {
      content: "";
      position: absolute;
      top: 6px;
      left: 13px;
      width: 8px;
      height: 6px;
      border-radius: 50%;
      background: #805257;
    }
    .muzzle::after {
      content: "";
      position: absolute;
      top: 11px;
      left: 16px;
      width: 2px;
      height: 6px;
      background: #805257;
    }

    .cheek {
      position: absolute;
      top: 77px;
      width: 19px;
      height: 10px;
      border-radius: 50%;
      background: #ec8f9e;
      opacity: .7;
    }
    .cheek.left { left: 21px; }
    .cheek.right { right: 21px; }

    .heart {
      position: absolute;
      top: 17px;
      right: 24px;
      color: #ef88a7;
      font-size: 36px;
      animation: beat 1.2s ease-in-out infinite;
    }

    h1 {
      margin: 12px 0;
      color: #a95776;
      font-family: Georgia, serif;
      font-size: clamp(1.8rem, 7vw, 2.35rem);
      font-weight: 600;
    }

    p {
      margin: 12px auto 23px;
      max-width: 340px;
      font-size: 1.05rem;
      line-height: 1.75;
    }

    .hug {
      display: inline-block;
      padding: 13px 21px;
      border: 0;
      border-radius: 99px;
      background: #e987a5;
      color: white;
      font: inherit;
      font-weight: 700;
      box-shadow: 0 7px 18px rgb(211 112 145 / 28%);
      cursor: pointer;
      transition: transform 180ms ease, background 180ms ease;
    }
    .hug:hover { transform: translateY(-2px) scale(1.03); background: #d97092; }
    .hug:focus-visible { outline: 3px solid #a95776; outline-offset: 4px; }

    .note {
      min-height: 1.5em;
      margin: 14px 0 0;
      color: #bb6d89;
      font-size: .9rem;
    }

    .floaty {
      position: fixed;
      bottom: -30px;
      color: #e889a5;
      pointer-events: none;
      animation: float-up 5s linear forwards;
    }

    @keyframes arrive {
      from { opacity: 0; transform: translateY(18px) scale(.97); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    @keyframes beat {
      50% { transform: scale(1.22); }
    }
    @keyframes float-up {
      to { opacity: 0; transform: translateY(-110vh) rotate(18deg); }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
      }
    }
  </style>
</head>
<body>
  <main class="card">
    <span class="tag">маленький подарок для самой любимой</span>
    <span class="heart" aria-hidden="true">♥</span>

    <div class="bear" role="img" aria-label="Милый медвежонок с сердечком">
      <span class="ear left"></span>
      <span class="ear right"></span>
      <span class="eye left"></span>
      <span class="eye right"></span>
      <span class="cheek left"></span>
      <span class="cheek right"></span>
      <span class="muzzle"></span>
    </div>

    <h1>Для моей любимой</h1>
    <p>
      Даже на расстоянии я хочу тебя обнять.
      Представь, что этот медвежонок передаёт тебе
      самое нежное и крепкое объятие — от меня 💗
    </p>

    <button class="hug" type="button">Нажми, чтобы обняться 🫂</button>
    <div class="note" aria-live="polite"></div>
  </main>

  <script>
    const button = document.querySelector(".hug");
    const note = document.querySelector(".note");

    button.addEventListener("click", () => {
      note.textContent = "Обнимаю крепко-крепко. Ты у меня самая чудесная! 💕";

      for (let i = 0; i < 12; i += 1) {
        const heart = document.createElement("span");
        heart.className = "floaty";
        heart.textContent = i % 2 === 0 ? "♥" : "♡";
        heart.style.left = `${8 + Math.random() * 84}%`;
        heart.style.fontSize = `${16 + Math.random() * 20}px`;
        heart.style.animationDelay = `${Math.random() * 700}ms`;
        document.body.append(heart);
        heart.addEventListener("animationend", () => heart.remove(), { once: true });
      }
    });
  </script>
</body>
</html>
